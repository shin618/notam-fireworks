name: Update FIREWORKS KMZ

on:
  schedule:
    - cron: "15 9,21 * * *"  # JST 06:15 / 18:15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_fireworks.py
      - name: Commit changes
        run: |
          git add data kmz fireworks.kml
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FIREWORKS data"
          git push
